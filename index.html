document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;text-transform:uppercase;margin:20px 0 0\">Ömer Doğan\n        <em style=\"display:block;font-style:italic;text-transform:none;font-size:.44em;color:#A8813F;letter-spacing:.06em;margin-top:10px\">hair studio<\u002Fem>\n      <\u002Fh1>\n      <p style=\"font:300 16px/1.7 'Jost',sans-serif;color:#45413A;max-width:44ch;margin:24px 0 32px;text-wrap:pretty\">Saç, sakal ve bakımda özenli işçilik. Boş saati seç, adını bırak — gerisini biz hallederiz.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <a href=\"#randevu\" style=\"position:relative;overflow:hidden;font:500 13px/1 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;background:#15130F;color:#F6EDDC;padding:19px 30px;border-radius:100px;transition:background .2s ease\" style-hover=\"background:#A8813F;color:#fff\">Randevu Al\n          <span style=\"position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(90deg,rgba(246,237,220,0),rgba(246,237,220,.32),rgba(246,237,220,0));animation:odShine 3.6s ease-in-out 1.2s infinite\"><\u002Fspan>\n        <\u002Fa>\n        <sc-if value=\"{{ hasPhone }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"font:500 13px/1 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;border:1px solid #D8CDB8;color:#15130F;padding:19px 30px;border-radius:100px;transition:border-color .2s ease\" style-hover=\"border-color:#15130F\">WhatsApp'tan Yaz<\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noPhone }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font:400 11px/1 ui-monospace,monospace;letter-spacing:.08em;border:1px dashed #D8CDB8;color:#8C877D;padding:19px 24px;border-radius:100px;display:inline-flex;align-items:center\">[TELEFON EKLENECEK]<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:clamp(24px,4vw,44px);margin-top:44px;flex-wrap:wrap\">\n        <sc-for list=\"{{ h -width:1140px;margin:0 auto;padding:0 22px\">\n    <div style=\"max-width:600px;margin-bottom:40px\">\n      <div style=\"display:flex;align-items:center;gap:12px;font:500 10px/1 'Jost',sans-serif;letter-spacing:.4em;text-transform:uppercase;color:#8C877D\">\n        <span style=\"width:26px;height:1px;background:#C9A961\"><\u002Fspan>Hizmetler\n      <\u002Fdiv>\n      <h2 style=\"font:500 clamp(30px,5vw,46px)/1.05 'Cormorant Garamond',serif;margin:16px 0 0\">Fiyat <em style=\"font-style:italic;color:#A8813F\">listesi<\u002Fem><\u002Fh2>\n      <p style=\"font:300 15px/1.7 'Jost',sans-serif;color:#45413A;margin:14px 0 0;text-wrap:pretty\">Şeffaf fiyat, sabit kalite. Her hizmetin süresi randevu aralığını belirler.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 60px\">\n      <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;padding:19px 0;border-bottom:1px solid #E9E3D8\">\n          <span style=\"flex:none;font:600 22px/1.1 'Cormorant Garamond',serif\">{{ s.name }}<\u002Fspan>\n          <span style=\"flex:1;border-bottom:1px dotted #D8CDB8;transform:translateY(-4px);min-width:20px\"><\u002Fspan>\n          <span style=\"flex:none;font:600 22px/1 'Cormorant Garamond',serif;color:#A8813F\">{{ s.priceLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ekip\" style=\"padding:clamp(56px,7vw,88px) 0;background:#FFFFFF;border-top:1px solid #E9E3D8;border-bottom:1px solid #E9E3D8\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 22px\">\n    <div style=\"display:flex;align-items:center;gap:12px;font:500 10px/1 'Jost',sans-serif;letter-spacing:.4em;text-transform:uppercase;color:#8C877D\">\n      <span style=\"width:26px;height:1px;background:#C9A961\"><\u002Fspan>Ekip\n    <\u002Fdiv>\n    <h2 style=\"font:500 clamp(30px,5vw,46px v style=\"font:600 19px/1.1 'Cormorant Garamond',serif\">{{ adminDateLabel }}<\u002Fdiv>\n                  <div style=\"font:400 9px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#A8813F;margin-top:6px\">{{ adminDowLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ nextDay }}\" style=\"width:46px;height:46px;flex:none;border:1px solid #E9E3D8;background:#FFFFFF;border-radius:12px;cursor:pointer;font:400 15px/1 'Jost',sans-serif;transition:border-color .2s ease\" style-hover=\"border-color:#A8813F\">→<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-top:14px\">\n                <sc-for list=\"{{ quickDays }}\" as=\"q\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ q.pick }}\" style=\"{{ q.style }}\">{{ q.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0 22px\">\n                <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#FFFFFF;border:1px solid #E9E3D8;border-radius:14px;padding:15px\">\n                    <div style=\"font:700 26px/1 'Cormorant Garamond',serif\">{{ s.v }}<\u002Fdiv>\n                    <div style=\"font:400 10px/1.3 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8C877D;margin-top:6px\">{{ s.k }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ dayBookings }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div style=\"{{ b.style }}\">\n                  <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n                    <div style=\"font:600 20px/1 'Cormorant Garamond',serif;min-width:56px\"> \n              <sc-if value=\"{{ noBookings }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"text-align:center;color:#8C877D;font:300 14px/1.7 'Jost',sans-serif;padding:30px 0;border:1px dashed #E9E3D8;border-radius:14px\">Bu gün için randevu yok.<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;align-items:center;gap:14px;margin:34px 0 14px\">\n                <span style=\"font:500 10px/1 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#8C877D\">Usta Günlüğü<\u002Fspan>\n                <span style=\"flex:1;height:1px;background:#E9E3D8\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <sc-for list=\"{{ panelStaffPick }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ p.pick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0 16px\">\n                <sc-for list=\"{{ panelStaffStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"background:#FFFFFF;border:1px solid #E9E3D8;border-radius:14px;padding:14px\">\n                    <div style=\"font:700 24px/1 'Cormorant Garamond',serif\">{{ s.v }}<\u002Fdiv>\n                    <div style=\"font:400 10px/1.3 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8C877D;margin-top:6px\">{{ s.k }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px\">\n                <sc-for list=\"{{ panelGrid }}\" as=\"g\" hint-placeholder-count=\"24\">\n                  <div style=\"{{ g.style }}\">\n                    <div style=\"{{ g.ti n                    <label style=\"flex:1;min-width:110px;display:block\">\n                      <span style=\"display:block;font:400 9px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#A8813F;margin-bottom:7px\">Süre (dk)<\u002Fspan>\n                      <input type=\"number\" min=\"10\" step=\"5\" value=\"{{ s.dur }}\" sc-camel-on-change=\"{{ s.setDur }}\" style=\"width:100%;padding:13px;border:1px solid #E9E3D8;background:#FAF8F4;border-radius:12px;font:400 14px/1 'Jost',sans-serif;outline:none\" style-focus=\"border-color:#A8813F\">\n                    <\u002Flabel>\n                    <label style=\"flex:1;min-width:110px;display:block\">\n                      <span style=\"display:block;font:400 9px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#A8813F;margin-bottom:7px\">Fiyat (₺)<\u002Fspan>\n                      <input type=\"number\" min=\"0\" step=\"10\" value=\"{{ s.price }}\" sc-camel-on-change=\"{{ s.setPrice }}\" style=\"width:100%;padding:13px;border:1px solid #E9E3D8;background:#FAF8F4;border-radius:12px;font:400 14px/1 'Jost',sans-serif;outline:none\" style-focus=\"border-color:#A8813F\">\n                    <\u002Flabel>\n                    <button type=\"button\" sc-camel-on-click=\"{{ s.remove }}\" style=\"width:46px;height:46px;flex:none;border:1px solid #E9E3D8;background:none;color:#8A5145;border-radius:12px;cursor:pointer;font:400 15px/1 'Jost',sans-serif;transition:border-color .2s ease\" style-hover=\"border-color:#B04A44\">×<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button type=\"button\" sc-camel-on-click=\"{{ addService }}\" style=\"width:100%;border:1px dashed #D8CDB8;background:none;color:#15130F;font:500 10px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:18px;border-radius:100px;cursor:pointer;transition:border-color .2s ease\" style-hover=\"border-color:#15130F\">+ Hizm yle-hover=\"border-color:#15130F\">+ Personel Ekle<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabGallery }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:odFadeUp .35s ease both\">\n              <div style=\"font:500 10px/1 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#8C877D\">Galeri<\u002Fdiv>\n              <p style=\"font:300 13px/1.7 'Jost',sans-serif;color:#8C877D;margin:8px 0 16px\">Fotoğraf yükleyin, başlık verin, sırasını değiştirin. Değişiklikler sitedeki galeriye anında yansır.<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px\">\n                <sc-for list=\"{{ galEdit }}\" as=\"g\" hint-placeholder-count=\"9\">\n                  <div style=\"background:#FFFFFF;border:1px solid #E9E3D8;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px\">\n                    <div style=\"position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#F1ECE3 0 9px,#E8E1D5 9px 18px);display:grid;place-items:center\">\n                      <sc-if value=\"{{ g.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div role=\"img\" aria-label=\"{{ g.label }}\" style=\"{{ g.bgStyle }}\"><\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ g.noImg }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"font:400 9px/1.4 ui-monospace,monospace;letter-spacing:.14em;color:#9A9285;text-transform:uppercase\">Fotoğraf yok<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <input type=\"text\" value=\"{{ g.label }}\" sc-camel-on-change=\"{{ g.setLabel }}\" placeholder=\"Başlık\" style=\"width:100%;padding:12px;border:1px solid #E9E3D8;background:#FAF8F4;border-radius:10px;font:400 13px/1 'Jost',sans-serif;outline:none\" style-focus=\"border-color:#A8813F\">\n                    <label style=\"display:block;text-align:center;background:#15130F;color:#F6EDDC;font:500 10px/1 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:14px 8px;border-radius:100px;cursor:pointer;transition:background .2s ease\" style-hover=\"background:#A8813F\">Fotoğraf Yükle\n                      <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ g.upload }}\" style=\"display:none\">\n                    <\u002Flabel>\n                    <div style=\"display:flex;gap:6px\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ g.up }}\" aria-label=\"Yukarı\" style=\"flex:1;height:44px;border:1px solid #E9E3D8;background:none;border-radius:10px;cursor:pointer;font:400 14px/1 'Jost',sans-serif;color:#45413A\" style-hover=\"border-color:#A8813F\">←<\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{ g.down }}\" aria-label=\"Aşağı\" style=\"flex:1;height:44px;border:1px solid #E9E3D8;background:none;border-radius:10px;cursor:pointer;font:400 14px/1 'Jost',sans-serif;color:#45413A\" style-hover=\"border-color:#A8813F\">→<\u002Fbutton>\n                      <sc-if value=\"{{ g.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ g.clearImg }}\" style=\"flex:1.4;height:44px;border:1px solid #E9E3D8;background:none;border-radius:10px;cursor:pointer;font:500 9px/1 'Jost',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#45413A\" style-hover=\"border-color:#A8813F\">Kaldır<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <button type=\"button\" sc-camel-on-click=\"{{ g.remove }}\" aria-label=\"Sil\" style=\"flex:1;height:44px;border:1px solid #E9E3D8;background:none;border-radius:10px;cursor:pointer;font:400 15px/1 'Jost',sans-serif;color:#8A5145\" style-hover=\"border-color:#B04A44\">×<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ addGallery }}\" style=\"width:100%;margin-top:14px;border:1px dashed #D8CDB8;background:none;color:#15130F;font:500 10px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:18px;border-radius:100px;cursor:pointer;transition:border-color .2s ease\" style-hover=\"border-color:#15130F\">+ Görsel Ekle<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabHours }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:odFadeUp .35s ease both\">\n              <div style=\"font:500 10px/1 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#8C877D\">Çalışma Saatleri<\u002Fdiv>\n              <div style=\"display:flex;gap:10px;margin:16px 0 26px;flex-wrap:wrap\">\n                <label style=\"flex:1;min-width:140px;display:block\">\n                  <span style=\"display:block;font:400 9px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8C877D;margin-bottom:8px\">Açılış<\u002Fspan>\n                  <input type=\"time\" value=\"{{ openVal }}\" sc-camel-on-change=\"{{ setOpen }}\" style=\"width:100%;padding:15px 14px;border:1px solid #E9E3D8;background:#FFFFFF;border-radius:12px;font:400 15px/1 'Jost',sans-serif;outline:none\" style-focus=\"border-color:#A8813F\">\n                <\u002Flabel>\n                <label style=\"flex:1;min-width:140px;display:block\">\n                  <span style=\"display:block;font:400 9px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8C877D;margin-bottom:8px\">Kapanış<\u002Fspan>\n                  <input type=\"time\" value=\"{{ closeVal }}\" sc-camel-on-change=\"{{ setClose }}\" style=\"width:100%;padding:15px 14px;border:1px solid #E9E3D8;background:#FFFFFF;border-radius:12px;font:400 15px/1 'Jost',sans-serif;outline:none\" style-focus=\"border-color:#A8813F\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div style=\"font:500 10px/1 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#8C877D\">Kapalı Günler<\u002Fdiv>\n              <p style=\"font:300 13px/1.7 'Jost',sans-serif;color:#8C877D;margin:8px 0 14px\">Seçili günler randevu takviminde görünmez.<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ closedToggles }}\" as=\"d\" hint-placeholder-count=\"7\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ d.toggle }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"height:1px;background:#E9E3D8;margin:30px 0 22px\"><\u002Fdiv>\n              <div style=\"font:500 10px/1 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#8C877D\">İletişim<\u002Fdiv>\n              <p style=\"font:300 13px/1.7 'Jost',sans-serif;color:#8C877D;margin:8px 0 14px\">Numarayı buraya bir kez girin: sitedeki tüm telefon/WhatsApp butonları ve randevu gönderimi aktifleşir.<\u002Fp>\n              <label style=\"display:block\">\n                <span style=\"display:block;font:400 9px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8C877D;margin-bottom:8px\">Telefon / WhatsApp<\u002Fspan>\n                <input type=\"tel\" value=\"{{ contactPhone }}\" sc-camel-on-change=\"{{ setContactPhone }}\" placeholder=\"[TELEFON EKLENECEK]\" style=\"width:100%;padding:16px 14px;border:1px solid #E9E3D8;background:#FFFFFF;border-radius:12px;font:400 15px/1 'Jost',sans-serif;outline:none\" style-focus=\"border-color:#A8813F\">\n              <\u002Flabel>\n              <label style=\"display:block;margin-top:14px\">\n                <span style=\"display:block;font:400 9px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8C877D;margin-bottom:8px\">Instagram kullanıcı adı<\u002Fspan>\n                <input type=\"text\" value=\"{{ contactIg }}\" sc-camel-on-change=\"{{ setContactIg }}\" style=\"width:100%;padding:16px 14px;border:1px solid #E9E3D8;background:#FFFFFF;border-radius:12px;font:400 15px/1 'Jost',sans-serif;outline:none\" style-focus=\"border-color:#A8813F\">\n              <\u002Flabel>\n              <div style=\"height:1px;background:#E9E3D8;margin:30px 0 22px\"><\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ resetDemo }}\" style=\"width:100%;border:1px solid #E9E3D8;background:none;color:#8A5145;font:500 10px/1 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:17px;border-radius:100px;cursor:pointer;transition:border-color .2s ease\" style-hover=\"border-color:#B04A44\">Demo Verilerini Sıfırla<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;adminPassword&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;omer2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Yönetim&quot;},&quot;bookingDaysAhead&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:7,&quot;max&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Randevu&quot;},&quot;requirePhone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Randevu&quot;},&quot;seedDemoBookings&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Randevu&quot;}}\">\nconst KEY = 'odhs_db_v2';\nconst DOW = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];\nconst DOW_S = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];\nconst MON = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];\nconst STATUS = { onay: 'Onaylandı', tamam: 'Tamamlandı', iptal: 'İptal' };\nconst GALLERY = ['saç kesimi', 'sakal', 'fade', 'salon', 'yıkama', 'styling', 'cilt bakımı', 'detay', 'ekip'];\n\nfunction ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\nfunction parseYmd(s) { const p = String(s).split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }\nfunction toMin(t) { const p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1] || 0); }\nfunction fromMin(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }\nfunction initials(name) {\n  return String(name).trim().split(/\\s+/).map(function (w) { return w[0] || ''; }).slice(0, 2).join('').toLocaleUpperCase('tr');\n}\nfunction money(n) { return '₺' + Number(n).toLocaleString('tr-TR'); }\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const db = this.load();\n    this.state = {\n      db: db,\n      sel: { serviceId: db.services[0] ? db.services[0].id : null, staffId: db.staff[0] ? db.staff[0].id : null, date: null, time: null },\n      form: { name: '', phone: '' },\n      sheet: 'closed',\n      done: null,\n      panel: false,\n      pw: '', pwError: false, authed: false,\n      tab: 'day',\n      adminDate: ymd(new Date()),\n      panelStaff: db.staff[0] ? db.staff[0].id : null\n    };\n  }\n\n  seed() {\n    const svc = [\n      ['Saç Kesimi', 30, 400], ['Sakal Tıraşı', 20, 200], ['Saç + Sakal', 45, 550],\n      ['Çocuk Saç Kesimi', 30, 300], ['Ağda / Depilasyon', 20, 250], ['Cilt Bakımı', 40, 500],\n      ['Saç Boyama', 60, 700], ['VIP Bakım Paketi', 75, 1000]\n    ].map(function (r, i) { return { id: 's' + (i + 1), name: r[0], dur: r[1], price: r[2] }; });\n    const staff = ['Ahmet Polat', 'Kerim Bayam', 'Mertcan Sarıkaya', 'Muhammed Ömer Doğan', 'Mahmut Çetin']\n      .map(function (n, i) { return { id: 'p' + (i + 1), name: n, role: i === 3 ? 'Kurucu Usta' : 'Berber' }; });\n    const db = {\n      services: svc, staff: staff,\n      hours: { open: '09:00', close: '21:00' },\n      closedDays: [0],\n      contact: { phone: '', ig: 'omerdoganhairstudio' },\n      gallery: GALLERY.map(function (g, i) { return { id: 'g' + (i + 1), label: g, img: '' }; }),\n      bookings: []\n    };\n    if (this.props.seedDemoBookings !== false) {\n      const t = new Date();\n      const today = ymd(t);\n      const d2 = new Date(t.getTime() + 86400000);\n      if (d2.getDay() === 0) d2.setDate(d2.getDate() + 1);\n      const tom = ymd(d2);\n      db.bookings = [\n        { id: 'b1', name: 'Emre Yıldız', phone: '0532 000 00 01', serviceId: 's1', staffId: 'p1', date: today, time: '10:00', dur: 30, price: 400, status: 'tamam' },\n        { id: 'b2', name: 'Burak Şahin', phone: '0532 000 00 02', serviceId: 's3', staffId: 'p1', date: today, time: '13:00', dur: 45, price: 550, status: 'onay' },\n        { id: 'b3', name: 'Kaan Aydın', phone: '0532 000 00 03', serviceId: 's2', staffId: 'p2', date: today, time: '15:20', dur: 20, price: 200, status: 'onay' },\n        { id: 'b4', name: 'Serkan Demir', phone: '0532 000 00 04', serviceId: 's8', staffId: 'p4', date: today, time: '17:00', dur: 75, price: 1000, status: 'onay' },\n        { id: 'b5', name: 'Tolga Kurt', phone: '0532 000 00 05', serviceId: 's7', staffId: 'p3', date: tom, time: '11:00', dur: 60, price: 700, status: 'onay' }\n      ];\n    }\n    return db;\n  }\n\n  load() {\n    let db = null;\n    try { db = JSON.parse(window.localStorage.getItem(KEY)); } catch (e) { db = null; }\n    if (!db || !db.services || !db.services.length) {\n      db = this.seed();\n      try { window.localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}\n    }\n    if (!Array.isArray(db.gallery)) {\n      db.gallery = GALLERY.map(function (g, i) { return { id: 'g' + (i + 1), label: g, img: '' }; });\n      try { window.localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}\n    }\n    return db;\n  }\n\n  componentDidMount() {\n    this.onStorage = (e) => {\n      if (e.key === KEY && e.newValue) {\n        try { this.setState({ db: JSON.parse(e.newValue) }); } catch (err) {}\n      }\n    };\n    window.addEventListener('storage', this.onStorage);\n    if (!this.state.sel.date) {\n      const sel = this.state.sel;\n      const s = this.svc(sel.serviceId);\n      const dur = s ? s.dur : 30;\n      const days = this.openDays();\n      let pick = null;\n      for (let i = 0; i < days.length && !pick; i++) {\n        const key = ymd(days[i]);\n        const anyFree = this.state.db.staff.some((p) => {\n          return this.slots(key, p.id, dur).some(function (x) { return !x.disabled; });\n        });\n        if (anyFree) pick = key;\n      }\n      if (!pick && days.length) pick = ymd(days[0]);\n      if (pick) {\n        const free = this.state.db.staff.filter((p) => {\n          return this.slots(pick, p.id, dur).some(function (x) { return !x.disabled; });\n        });\n        this.setState({\n          sel: Object.assign({}, sel, {\n            date: pick,\n            staffId: free.length ? free[0].id : sel.staffId\n          })\n        });\n      }\n    }\n  }\n  componentWillUnmount() { window.removeEventListener('storage', this.onStorage); }\n\n  patch(fn) {\n    const next = JSON.parse(JSON.stringify(this.state.db));\n    fn(next);\n    try { window.localStorage.setItem(KEY, JSON.stringify(next)); }\n    catch (e) { window.alert('Depolama alanı doldu. Bazı galeri fotoğraflarını silip tekrar deneyin.'); return; }\n    this.setState({ db: next });\n  }\n\n  uploadGallery(id, file) {\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      const img = new Image();\n      img.onload = () => {\n        const max = 900;\n        const r = Math.min(1, max / Math.max(img.width, img.height));\n        const c = document.createElement('canvas');\n        c.width = Math.round(img.width * r);\n        c.height = Math.round(img.height * r);\n        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n        const data = c.toDataURL('image/jpeg', 0.8);\n        this.patch(function (d) { d.gallery.forEach(function (x) { if (x.id === id) x.img = data; }); });\n      };\n      img.src = reader.result;\n    };\n    reader.readAsDataURL(file);\n  }\n\n  svc(id) { return this.state.db.services.filter(function (s) { return s.id === id; })[0] || null; }\n  per(id) { return this.state.db.staff.filter(function (p) { return p.id === id; })[0] || null; }\n  dayLabel(dateStr) { const d = parseYmd(dateStr); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }\n\n  slots(dateStr, staffId, dur) {\n    const db = this.state.db;\n    if (!dateStr || !staffId) return [];\n    const open = toMin(db.hours.open);\n    const close = toMin(db.hours.close);\n    const busy = db.bookings.filter(function (b) {\n      return b.date === dateStr && b.staffId === staffId && b.status !== 'iptal';\n    }).map(function (b) { return [toMin(b.time), toMin(b.time) + b.dur]; });\n    const now = new Date();\n    const isToday = dateStr === ymd(now);\n    const nowMin = now.getHours() * 60 + now.getMinutes();\n    const out = [];\n    for (let t = open; t + 30 <= close; t += 30) {\n      const clash = busy.some(function (r) { return t < r[1] && t + dur > r[0]; });\n      const noFit = t + dur > close;\n      out.push({ time: fromMin(t), disabled: clash || noFit || (isToday && t <= nowMin) });\n    }\n    return out;\n  }\n\n  openDays() {\n    const db = this.state.db;\n    const ahead = Number(this.props.bookingDaysAhead || 14);\n    const out = [];\n    const base = new Date();\n    for (let i = 0; i < ahead + 7 && out.length < ahead; i++) {\n      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() +  '#45413A',\n      font: \"500 10px/1 'Jost', sans-serif\", letterSpacing: '.16em', textTransform: 'uppercase',\n      transition: 'all .2s ease'\n    };\n  }\n  dayToggleStyle(active) {\n    return {\n      padding: '14px 16px', cursor: 'pointer', borderRadius: '100px',\n      border: '1px solid ' + (active ? '#A8813F' : '#E9E3D8'),\n      background: active ? '#A8813F' : '#FFFFFF',\n      color: active ? '#FFFFFF' : '#45413A',\n      font: \"500 11px/1 'Jost', sans-serif\", letterSpacing: '.1em', transition: 'all .2s ease'\n    };\n  }\n\n  setSel(patch) { this.setState({ sel: Object.assign({}, this.state.sel, patch) }); }\n\n  openSheet(time) {\n    this.setState({ sel: Object.assign({}, this.state.sel, { time: time }), sheet: 'form', form: { name: '', phone: '' } });\n  }\n  closeSheet() { this.setState({ sheet: 'closed', done: null }); }\n\n  confirmBooking() {\n    const sel = this.state.sel;\n    const f = this.state.form;\n    const s = this.svc(sel.serviceId);\n    const b = {\n      id: 'b' + Date.now(),\n      name: f.name.trim(), phone: f.phone.trim(),\n      serviceId: sel.serviceId, staffId: sel.staffId,\n      date: sel.date, time: sel.time,\n      dur: s ? s.dur : 30, price: s ? s.price : 0, status: 'onay'\n    };\n    this.patch(function (db) { db.bookings.push(b); });\n    this.setState({ done: b, sheet: 'done' });\n  }\n\n  waHref(text) {\n    const digits = String(this.state.db.contact.phone || '').replace(/[^0-9]/g, '');\n    if (!digits) return '';\n    const num = digits.length === 11 && digits[0] === '0' ? '90' + digits.slice(1) : digits;\n    return 'https://wa.me/' + num + (text ? '?text=' + encodeURIComponent(text) : '');\n  }\n\n  renderVals() {\n    const self = this;\n    const db = this.state.db;\n    const st = this.state;\n    const sel = st.sel;\n    const phone = String(db.contact.phone || '').trim();\n    const hasPhone = phone.length > 0;\n    const curSvc = this.svc(sel.serviceId);\n    const dur = curSvc ? curSvc.dur : 30;\n  (e) => { const val = e.target.value; this.patch(function (d) { d.contact.phone = val; }); };\n    v.setContactIg = (e) => { const val = e.target.value.replace(/[@\\s]/g, ''); this.patch(function (d) { d.contact.ig = val; }); };\n    v.resetDemo = () => {\n      const fresh = this.seed();\n      try { window.localStorage.setItem(KEY, JSON.stringify(fresh)); } catch (e) {}\n      this.setState({ db: fresh });\n    };\n\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
